<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karaoke · Universal Remote</title>
<!--
  Escenario de KARAOKE en el televisor (Universal Remote, 2026-09-14).
  Todo el escenario vive en stage.js y se monta en la página que toque: aquí (navegador del
  TV) o dentro del receptor de Cast. Motivo: en el Samsung, el receptor de Cast no emite
  el audio de un marco (iframe) pero sí el de su propia página; el escenario tiene que
  vivir en la página principal para que la voz suene.
  La app pasa el código en la URL (?code=XXXXXX).
-->
<style>html,body{margin:0;height:100%;background:#05060a}</style>
</head>
<body>
<script src="stage.js"></script>
<script>
(function () {
  var m = /[?&]code=([A-Za-z0-9]{6})/.exec(location.search);
  window.UrpKaraokeStage.mount(document.body, { code: m ? m[1].toUpperCase() : '' });
})();
</script>
</body>
</html>
